name: Deploy visual simulation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "rdashphdia-elp-visual-simulation.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.parts.append("".join(self.current))
                      self.in_script = False

          parser = Scripts()
          parser.feed(Path("rdashphdia-elp-visual-simulation.html").read_text(encoding="utf-8"))
          if not parser.parts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/simulation.js").write_text("\n".join(parser.parts), encoding="utf-8")
          PY
          node --check /tmp/simulation.js
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp rdashphdia-elp-visual-simulation.html _site/index.html
          cp rdashphdia-elp-visual-simulation.html _site/rdashphdia-elp-visual-simulation.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
