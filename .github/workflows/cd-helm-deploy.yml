name: CD - Helm Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
      - name: Decode Kuberconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG" | base64 --decode > kuberconfig
          export KUBECONFIG=$PWD/kuberconfig
          kubectl version --client
      - name: Helm upgrade
        env:
          IMAGE_TAG: ${{ github.sha }}
      KUBE_CONFIG: $PWD/Kuberconfig
        run: |
          helm upgrade --install hybrid-opt charts/hybrid-opt \
            --set image.repository=ghcr.io/${{ github.repository }}/hybrid-opt \
            --set image.tag=${IMAGE_TAG}
