name: CD - Helm Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Decode Kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::Set the repository Actions secret KUBE_CONFIG to a base64-encoded kubeconfig for the target cluster."
            exit 1
          fi
          if ! printf '%s' "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kubeconfig"; then
            echo "::error::KUBE_CONFIG is not valid base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/kubeconfig" ]; then
            echo "::error::Decoded kubeconfig is empty."
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Verify Kubernetes connection
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl cluster-info --request-timeout=15s
          kubectl get nodes --request-timeout=15s

      - name: Helm Deploy
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          helm upgrade --install rdashphdia-elp ./charts/hybrid-opt \
            --namespace rdashphdia-elp \
            --create-namespace \
            --set-string image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 5m
